[package]
name = "tide"
version = "0.1.0"
description = "Tide — Hidden-Liquidity DCA Pool Anchor program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tide"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
# Pin to anchor-spl 0.30.x to avoid pulling in spl-token-2022 v6 which has
# transitive zeroize ^1.7 conflict with curve25519-dalek's zeroize ^1 pin.
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
solana-program = "1.18"
