<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#050709"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)" rx="180"/>

  <!-- Ambient glow behind waves -->
  <circle cx="512" cy="512" r="380" fill="url(#glow)"/>

  <!-- Three tide waves: opacity ascending (light → bright) -->
  <g stroke="url(#wave)" stroke-width="56" stroke-linecap="round" fill="none">
    <!-- Wave 1 - back, faded -->
    <path d="M 192 360 Q 320 280, 448 360 T 704 360 T 832 360" opacity="0.32"/>
    <!-- Wave 2 - mid -->
    <path d="M 192 512 Q 320 432, 448 512 T 704 512 T 832 512" opacity="0.62"/>
    <!-- Wave 3 - front, full -->
    <path d="M 192 664 Q 320 584, 448 664 T 704 664 T 832 664" opacity="1"/>
  </g>

  <!-- Subtle inner border -->
  <rect x="2" y="2" width="1020" height="1020" rx="180" fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="2"/>
</svg>
