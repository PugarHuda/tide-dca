<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#050709"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0fbff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)" rx="200"/>
  <circle cx="600" cy="500" r="440" fill="url(#glow)"/>

  <!-- Three tide waves -->
  <g stroke="url(#wave)" stroke-width="48" stroke-linecap="round" fill="none">
    <path d="M 280 360 Q 400 290, 520 360 T 760 360 T 920 360" opacity="0.30"/>
    <path d="M 280 480 Q 400 410, 520 480 T 760 480 T 920 480" opacity="0.60"/>
    <path d="M 280 600 Q 400 530, 520 600 T 760 600 T 920 600" opacity="1"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="820" text-anchor="middle"
        font-family="'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="180" font-weight="800" letter-spacing="-8"
        fill="url(#text)">Tide</text>

  <!-- Tagline -->
  <text x="600" y="900" text-anchor="middle"
        font-family="'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="34" font-weight="500" letter-spacing="6"
        fill="#67e8f9" fill-opacity="0.75">DCA WITHOUT MEV</text>

  <rect x="2" y="2" width="1196" height="1196" rx="200" fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="2"/>
</svg>
